name: CI develop

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Actualizar README
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Añadir y guardar la línea de la rama
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LINE="Añadida feature: $BRANCH_NAME"

            if ! grep -qxF "$LINE" README.md; then
              echo "$LINE" >> README.md
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add README.md
              git commit -m "Actualizar README con la feature"
              git push origin "HEAD:$BRANCH_NAME"
            fi
          fi

  validate-dev:
    name: Validar DEV_TOKEN en el runner
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Comparar el secreto con la variable local
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Output "CORRECTO: los tokens coinciden."
          } else {
            Write-Output "ERROR: los tokens no coinciden."
            exit 1
          }